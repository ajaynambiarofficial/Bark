services:
  - type: web
    name: bark-by-supertails
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm run start:api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: 29732196650-gu3aphpdp733irmkmsi3jr4j06fg592b.apps.googleusercontent.com
      - key: VITE_GOOGLE_CLIENT_ID
        value: 29732196650-gu3aphpdp733irmkmsi3jr4j06fg592b.apps.googleusercontent.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: barkissuetracker@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: barkissuetracker@gmail.com
      - key: GOD_EMAIL
        sync: false
      - key: GOD_PASSWORD
        sync: false
      - key: SESSION_COOKIE_NAME
        value: bark_session
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: info
