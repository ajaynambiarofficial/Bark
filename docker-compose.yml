services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bark
      POSTGRES_USER: bark
      POSTGRES_PASSWORD: bark
    ports:
      - "5432:5432"
    volumes:
      - bark_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bark -d bark"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bark_postgres_data:
